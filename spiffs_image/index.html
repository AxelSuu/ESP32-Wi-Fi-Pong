<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GameBox Controller</title>
  <style>
    :root {
      --gap: 14px;
      --cyan: #29f0ff;
      --green: #39ff9e;
      --pink: #ff2d95;
      --amber: #ffd23f;
      --panel: #141a2b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      color: #e8eef5;
      background:
        radial-gradient(1200px 600px at 50% -10%, #1b2540 0%, #0a0e18 60%, #05070d 100%);
      display: flex; flex-direction: column;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    /* subtle moving grid backdrop */
    body::before {
      content: ""; position: fixed; inset: -50%;
      background-image:
        linear-gradient(rgba(41,240,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(41,240,255,.06) 1px, transparent 1px);
      background-size: 36px 36px;
      transform: perspective(400px) rotateX(60deg);
      animation: drift 12s linear infinite; pointer-events: none; z-index: 0;
    }
    @keyframes drift { from { background-position: 0 0; } to { background-position: 0 36px; } }

    header { padding: 12px 10px 4px; text-align: center; z-index: 1; }
    h1 {
      margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 6px;
      color: #fff; text-shadow: 0 0 8px var(--cyan), 0 0 18px rgba(41,240,255,.6);
    }
    #status { font-size: 12px; letter-spacing: 1px; color: #8a93a0; margin-top: 6px; }
    #status.connected    { color: var(--green); text-shadow: 0 0 8px rgba(57,255,158,.7); }
    #status.disconnected { color: var(--pink);  text-shadow: 0 0 8px rgba(255,45,149,.7); }

    main { flex: 1; display: flex; flex-direction: column; padding: var(--gap); gap: var(--gap); z-index: 1; min-height: 0; }
    .surface { flex: 1; display: none; flex-direction: column; gap: var(--gap); min-height: 0; }
    .surface.active { display: flex; }

    button {
      font-size: 28px; font-weight: 800; letter-spacing: 1px;
      color: #eaf6ff; border: 2px solid #2b3a5c; border-radius: 16px;
      background: linear-gradient(180deg, #1a2238, #11182a);
      flex: 1; min-height: 64px;
      transition: transform .07s, box-shadow .12s, filter .12s; touch-action: manipulation;
    }
    button:active { transform: scale(0.96); filter: brightness(1.3); }
    .row { display: flex; gap: var(--gap); flex: 1; }

    .accent  { border-color: var(--cyan);  color: #d7fbff; box-shadow: 0 0 14px rgba(41,240,255,.35), inset 0 0 12px rgba(41,240,255,.12); }
    .primary { border-color: var(--green); color: #d8ffe9; box-shadow: 0 0 14px rgba(57,255,158,.35), inset 0 0 12px rgba(57,255,158,.12); }
    .warn    { border-color: var(--pink);  color: #ffd9ec; box-shadow: 0 0 14px rgba(255,45,149,.35), inset 0 0 12px rgba(255,45,149,.12); }
    .pill    { flex: 0 0 auto; min-height: 52px; font-size: 18px; }

    /* menu mirror list */
    .menulist { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; }
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 12px; font-size: 20px; font-weight: 700;
      border: 2px solid #223; color: #7c8aa5; background: rgba(255,255,255,.02);
    }
    .menu-item .badge { margin-left: auto; font-size: 13px; color: #5f6c86; }
    .menu-item.sel {
      color: #fff; border-color: var(--cyan);
      background: linear-gradient(90deg, rgba(41,240,255,.18), rgba(41,240,255,.02));
      box-shadow: 0 0 16px rgba(41,240,255,.5); text-shadow: 0 0 8px var(--cyan);
    }

    #tiltbar { flex: 0 0 auto; height: 28px; border: 2px solid var(--cyan); border-radius: 14px; position: relative; box-shadow: inset 0 0 12px rgba(41,240,255,.25); }
    #tiltdot { position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--cyan); left: calc(50% - 10px); box-shadow: 0 0 12px var(--cyan); transition: left .05s linear; }

    /* analog joystick (Survivor) */
    #joypad { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    #joybase {
      width: 72vmin; height: 72vmin; max-width: 92vw;   /* always a square → true circle */
      position: relative; border: 2px solid var(--cyan); border-radius: 50%;
      box-shadow: inset 0 0 22px rgba(41,240,255,.22); touch-action: none;
    }
    #joythumb {
      position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      background: radial-gradient(circle at 40% 35%, #bff6ff, var(--cyan) 45%, #11406a);
      box-shadow: 0 0 16px var(--cyan);
    }
    /* level-up pick row: three evenly-spread, compact buttons (not tall/squished) */
    .pickrow { display: flex; gap: var(--gap); flex: 0 0 auto; }
    .pickrow button { flex: 1; min-height: 50px; font-size: 20px; }

    .msg { text-align: center; font-size: 24px; font-weight: 800; color: #eaf6ff; margin: auto; text-shadow: 0 0 10px rgba(41,240,255,.5); }
    .sub { text-align: center; font-size: 16px; color: #9fb0cc; margin-top: 6px; }

    /* firmware update overlay */
    #gear {
      position: absolute; top: 10px; right: 12px; width: 38px; min-height: 38px;
      flex: none; font-size: 18px; padding: 0; border-radius: 10px;
    }
    #ota {
      position: fixed; inset: 0; z-index: 5; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px; background: rgba(5,7,13,.94);
    }
    #ota.show { display: flex; }
    #ota h2 { margin: 0; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px var(--cyan); }
    #ota .row, #ota button { flex: none; }
    #ota button { min-height: 56px; padding: 0 24px; }
    #otafile { color: #cdd8ea; font-size: 15px; }
    #ustatus { font-size: 14px; color: #9fb0cc; min-height: 18px; text-align: center; }
    #curver { font-size: 13px; color: #6b7790; }
    #fwver {
      position: fixed; bottom: 4px; left: 0; right: 0; text-align: center;
      font-size: 11px; letter-spacing: 1px; color: #46506a; z-index: 1; pointer-events: none;
    }
    #toast {
      position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
      background: rgba(20,26,43,.95); border: 1px solid var(--cyan); color: #eaf6ff;
      padding: 10px 18px; border-radius: 12px; font-size: 14px; letter-spacing: 1px;
      box-shadow: 0 0 16px rgba(41,240,255,.4); opacity: 0; transition: opacity .25s;
      pointer-events: none; z-index: 6; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header style="position: relative;">
    <h1>GAMEBOX</h1>
    <div id="status" class="disconnected">CONNECTING…</div>
    <button id="gear" class="accent" onclick="toggleOta(true)" title="Firmware update">&#9881;</button>
  </header>

  <!-- FIRMWARE UPDATE (OTA over the SoftAP) -->
  <div id="ota">
    <h2>FIRMWARE UPDATE</h2>
    <div class="sub">Upload a new <code>.bin</code> over Wi-Fi.<br>The console reboots when done.</div>
    <div id="curver"></div>
    <input id="otafile" type="file" accept=".bin">
    <button class="primary" onclick="flash()">FLASH</button>
    <div id="ustatus"></div>
    <div class="sub" style="margin-top:8px;">BRIGHTNESS</div>
    <input id="bright" type="range" min="0" max="255" value="128"
           oninput="setBrightness(this.value, 0)" onchange="setBrightness(this.value, 1)"
           style="width:80%;">
    <button class="pill warn" onclick="toggleOta(false)">CLOSE</button>
  </div>

  <main>
    <!-- MENU (mirrors the OLED via the "screen" message) -->
    <div class="surface" data-mode="menu">
      <div class="menulist" id="menulist"></div>
      <div class="row">
        <button class="accent" onclick="nav(-1)">&#9650;</button>
        <button class="accent" onclick="nav(1)">&#9660;</button>
      </div>
      <button class="primary" onclick="select()">SELECT</button>
    </div>

    <!-- PONG -->
    <div class="surface" data-mode="pong">
      <button class="accent" onclick="press('up')">&#9650; UP</button>
      <button class="accent" onclick="press('down')">&#9660; DOWN</button>
      <button class="pill warn" onclick="back()">MENU</button>
    </div>

    <!-- SNAKE -->
    <div class="surface" data-mode="snake">
      <div class="row"><button class="accent" onclick="press('up')">&#9650;</button></div>
      <div class="row">
        <button class="accent" onclick="press('left')">&#9664;</button>
        <button class="accent" onclick="press('right')">&#9654;</button>
      </div>
      <div class="row"><button class="accent" onclick="press('down')">&#9660;</button></div>
      <button class="pill warn" onclick="back()">MENU</button>
    </div>

    <!-- RACER -->
    <div class="surface" data-mode="racer">
      <div id="tiltbar"><div id="tiltdot"></div></div>
      <button class="primary tilt-toggle" onclick="enableTilt()">ENABLE TILT</button>
      <div class="row">
        <button class="accent" onclick="press('left')">&#9664;</button>
        <button class="accent" onclick="press('right')">&#9654;</button>
      </div>
      <button class="pill warn" onclick="back()">MENU</button>
    </div>

    <!-- BREAKOUT -->
    <div class="surface" data-mode="breakout">
      <button class="primary tilt-toggle" onclick="enableTilt()">ENABLE TILT</button>
      <div class="row">
        <button class="accent" onclick="press('left')">&#9664;</button>
        <button class="accent" onclick="press('right')">&#9654;</button>
      </div>
      <button class="pill warn" onclick="back()">MENU</button>
    </div>

    <!-- SURVIVOR (analog joystick to move; weapons auto-fire; ◀ PICK ▶ chooses upgrades) -->
    <div class="surface" data-mode="survivor">
      <div id="joypad">
        <div id="joybase" ontouchstart="joyStart(event)" ontouchmove="joyMove(event)"
             ontouchend="joyEnd(event)" onmousedown="joyStart(event)"
             onmousemove="joyMove(event)" onmouseup="joyEnd(event)">
          <div id="joythumb"></div>
        </div>
      </div>
      <div class="pickrow">
        <button class="accent" onclick="nav(-1)">&#9664;</button>
        <button class="primary" onclick="select()">PICK</button>
        <button class="accent" onclick="nav(1)">&#9654;</button>
      </div>
      <button class="pill warn" onclick="back()">MENU</button>
    </div>

    <!-- TRON -->
    <div class="surface" data-mode="tron">
      <div class="row">
        <button class="accent" onclick="press('left')">&#8634; LEFT</button>
        <button class="accent" onclick="press('right')">RIGHT &#8635;</button>
      </div>
      <button class="pill warn" onclick="back()">MENU</button>
    </div>

    <!-- WAITING -->
    <div class="surface" data-mode="waiting">
      <div>
        <div class="msg" id="waitmsg">WAITING FOR PLAYERS…</div>
        <div class="sub">Open this page on a second phone</div>
      </div>
    </div>

    <!-- GAME OVER -->
    <div class="surface" data-mode="gameover">
      <div>
        <div class="msg" id="overmsg">GAME OVER</div>
        <div class="sub" id="overscore"></div>
      </div>
      <button class="primary" onclick="select()">PLAY AGAIN</button>
      <button class="pill warn" onclick="back()">MENU</button>
    </div>

    <!-- INFO (generic non-game screen, e.g. high scores — content is on the OLED) -->
    <div class="surface" data-mode="info">
      <div class="msg" id="infomsg"></div>
      <button class="pill warn" onclick="back()">BACK</button>
    </div>
  </main>

  <div id="fwver"></div>
  <div id="toast"></div>

  <script>
    let socket, player = 0, mode = 'menu';
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 10;
    const statusEl = document.getElementById('status');

    // --- audio blips (WebAudio; context created lazily on first gesture) ---
    let actx;
    function beep(freq, ms, type) {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'square'; o.frequency.value = freq;
        o.connect(g); g.connect(actx.destination);
        const t0 = actx.currentTime;
        g.gain.setValueAtTime(0.05, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
        o.start(t0); o.stop(t0 + ms / 1000);
      } catch (e) {}
    }

    // --- transient toast (reconnect notices) ---
    let toastTimer;
    function showToast(msg, ms) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      if (ms) toastTimer = setTimeout(() => t.classList.remove('show'), ms);
    }
    function hideToast() { document.getElementById('toast').classList.remove('show'); }

    // --- footer: firmware version + measured round-trip latency ---
    let fwVersion = '', lastPing = null;
    function updateFooter() {
      document.getElementById('fwver').textContent =
        (fwVersion ? 'fw ' + fwVersion : '') +
        (lastPing != null ? '  ·  ' + lastPing + ' ms' : '');
    }

    function setSurface(m) {
      mode = m;
      document.querySelectorAll('.surface').forEach(s => {
        s.classList.toggle('active', s.dataset.mode === m);
      });
    }
    setSurface('menu');

    function send(obj) {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj));
    }

    // --- firmware update (POST a .bin to /update) ---
    function toggleOta(show) {
      document.getElementById('ota').classList.toggle('show', show);
      if (!show) document.getElementById('ustatus').textContent = '';
    }
    function flash() {
      const f = document.getElementById('otafile').files[0];
      const st = document.getElementById('ustatus');
      if (!f) { st.textContent = 'Pick a .bin first'; return; }
      st.textContent = 'Uploading ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB)…';
      fetch('/update', { method: 'POST', body: f })
        .then(r => r.text().then(t => {
          st.textContent = r.ok ? 'Flashed — console rebooting…' : ('Failed: ' + (t || r.status));
        }))
        .catch(() => { st.textContent = 'Upload error — check Wi-Fi'; });
    }
    function nav(d)    { send({ t: 'nav', dir: d }); beep(520, 25); }
    function select()  { send({ t: 'select' }); beep(700, 40); }
    function back()    { send({ t: 'back' }); setSurface('menu'); beep(360, 30); }
    function press(ev) { send({ t: 'input', ev: ev }); beep(660, 30); if (navigator.vibrate) navigator.vibrate(12); }
    function sendTilt(g) { send({ t: 'tilt', g: Math.round(g * 100) / 100 }); }

    // --- analog joystick (Survivor): drag → normalized (x, y), throttled ~30 Hz ---
    let joyActive = false, lastMove = 0;
    function joyVec(ev) {
      const r = document.getElementById('joybase').getBoundingClientRect();
      const t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
      let dx = (t.clientX - (r.left + r.width / 2)) / (r.width / 2);
      let dy = (t.clientY - (r.top + r.height / 2)) / (r.height / 2);
      const m = Math.hypot(dx, dy);
      if (m > 1) { dx /= m; dy /= m; }
      return { dx, dy };
    }
    function joyStart(ev) { ev.preventDefault(); joyActive = true; joyMove(ev); }
    function joyMove(ev) {
      if (!joyActive) return;
      ev.preventDefault();
      const now = Date.now();
      if (now - lastMove < 33) return;
      lastMove = now;
      const v = joyVec(ev);
      const thumb = document.getElementById('joythumb');
      thumb.style.left = (50 + v.dx * 40) + '%';
      thumb.style.top  = (50 + v.dy * 40) + '%';
      send({ t: 'move', x: Math.round(v.dx * 100) / 100, y: Math.round(v.dy * 100) / 100 });
    }
    function joyEnd(ev) {
      ev.preventDefault();
      joyActive = false;
      const thumb = document.getElementById('joythumb');
      thumb.style.left = '50%';
      thumb.style.top = '50%';
      send({ t: 'move', x: 0, y: 0 });
    }
    function setBrightness(v, save) { send({ t: 'brightness', v: Number(v), save: save ? 1 : 0 }); }

    // --- menu mirror: draw the live game list with the highlighted row ---
    function renderMenu(games, idx) {
      const list = document.getElementById('menulist');
      if (!list || !Array.isArray(games)) return;
      list.innerHTML = '';
      games.forEach((name, i) => {
        const row = document.createElement('div');
        row.className = 'menu-item' + (i === idx ? ' sel' : '');
        const label = document.createElement('span');
        label.textContent = name;
        row.appendChild(label);
        list.appendChild(row);
      });
    }

    // --- tilt (DeviceOrientation) ---
    let tiltArmed = false, lastTilt = 0;
    function onOrient(e) {
      const now = Date.now();
      if (now - lastTilt < 40) return;        // ~25 Hz throttle
      lastTilt = now;
      const g = e.gamma || 0;                  // left/right tilt in degrees
      sendTilt(g);
      const pct = Math.max(-1, Math.min(1, g / 45));
      document.getElementById('tiltdot').style.left = (50 + pct * 45) + '%';
    }
    function armTilt() {
      if (tiltArmed) return;
      tiltArmed = true;
      window.addEventListener('deviceorientation', onOrient);
      document.querySelectorAll('.tilt-toggle').forEach(b => b.textContent = 'TILT ON');
    }
    function enableTilt() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(s => { if (s === 'granted') armTilt(); })
          .catch(() => {});
      } else {
        armTilt();
      }
    }

    function onMessage(data) {
      let m;
      try { m = JSON.parse(data); } catch (e) { return; }
      switch (m.t) {
        case 'welcome': player = m.player; break;
        case 'system_info':
          fwVersion = m.version; updateFooter();
          document.getElementById('curver').textContent = 'Current: ' + m.version;
          break;
        case 'pong':
          lastPing = Math.max(0, Date.now() - m.ts); updateFooter();
          break;
        case 'screen':
          if (m.mode === 'info') {
            document.getElementById('infomsg').textContent = m.text || '';
            setSurface('info');
          } else {
            renderMenu(m.games, m.idx);
            setSurface('menu');
          }
          break;
        case 'active':  setSurface(m.game); break;
        case 'waiting':
          document.getElementById('waitmsg').textContent =
            'WAITING ' + m.have + '/' + m.need;
          setSurface('waiting');
          break;
        case 'over': {
          const won = (m.winner >= 0 && m.winner === player);
          document.getElementById('overmsg').textContent =
            (m.winner < 0) ? 'GAME OVER' :
            won ? 'YOU WIN!' : 'PLAYER ' + (m.winner + 1) + ' WINS';
          document.getElementById('overscore').textContent =
            (m.score >= 0) ? 'Score: ' + m.score : '';
          setSurface('gameover');
          if (navigator.vibrate) navigator.vibrate(won ? [40, 40, 80] : 60);
          if (m.winner < 0 || won) { beep(740, 90); setTimeout(() => beep(990, 140), 110); }
          else beep(200, 220);
          break;
        }
      }
    }

    let pingTimer = null, hadDrop = false;
    function connect() {
      socket = new WebSocket("ws://" + location.hostname + "/ws");
      socket.onopen = () => {
        statusEl.textContent = "CONNECTED";
        statusEl.className = "connected";
        reconnectAttempts = 0;
        send({ t: 'hello' });
        if (hadDrop) { showToast('Reconnected', 1500); hadDrop = false; }
        else hideToast();
        // Measure round-trip latency every 2 s (shown in the footer).
        clearInterval(pingTimer);
        send({ t: 'ping', ts: Date.now() });
        pingTimer = setInterval(() => send({ t: 'ping', ts: Date.now() }), 2000);
      };
      socket.onmessage = (e) => onMessage(e.data);
      socket.onclose = () => {
        statusEl.textContent = "DISCONNECTED — RECONNECTING…";
        statusEl.className = "disconnected";
        clearInterval(pingTimer);
        lastPing = null; updateFooter();
        if (reconnectAttempts < maxReconnectAttempts) {
          hadDrop = true;
          showToast('Reconnecting…');
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
          reconnectAttempts++;
          setTimeout(connect, delay);
        } else {
          statusEl.textContent = "CONNECTION FAILED — REFRESH PAGE";
          showToast('Connection failed — refresh', 0);
        }
      };
      socket.onerror = () => {};
    }
    connect();
  </script>
</body>
</html>
